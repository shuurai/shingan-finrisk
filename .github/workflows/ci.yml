# CI 说明
#
# 目标:一个便宜的"绿灯即合并"检查。刻意做得窄——单个 job、单个 OS、只跑一次。
#
# 成本控制(每一处都对应一个会重复发生的费用):
# - **单个 job、ubuntu-latest、单个 Python 版本。不做 matrix。**
#   一次 push = 一个 runner。测试套件本身 2 秒跑完,真正花钱的是装依赖那一分钟,
#   所以任何形式的矩阵都是在为同一份结果重复付费。
# - **py3.11** = pyproject.toml 里 `requires-python = ">=3.11,<3.14"` 的下界,
#   是版本假设真正会出问题的那一档。
# - **PR 只针对 main 触发。** 未加分支过滤的 `pull_request:` 会让任何分支的 PR
#   都跑。
# - **concurrency cancel-in-progress**:同一 PR 推新 commit 会取消在跑的那次。
#   实际节奏是 push→改→再 push,这条省得最多。
# - **不装 `train` extra**(torch/transformers/cu128,约 2 GB)。CI 无 GPU,测试
#   套件对 torch 做 lazy import。装了只是替 CI 付下载费。
# - **覆盖率采集不额外花钱。** `--cov` 在同一次运行里完成,不重跑、不并行。它现在
#   开启是因为 README 要报一个真实数字(gate 与模块明细都来自这里),而不是为了
#   设门槛。**覆盖率不设门槛、不阻断合并**——一个为了凑数而写的测试比没有测试更糟。
# - **不做 ruff/mypy 门禁。** lint 此前未经核实是否全绿,而一个长期红灯的检查比
#   没有检查更糟。需要时再加,放同一个 job 里几乎不增加成本。
# - **不上传覆盖率 artifact。** 数字写进 job summary 就够了,存一份构建产物只增加
#   存储成本。
#
# 本 workflow 不引用任何 secret,也不依赖需要凭据的 action。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (ubuntu, py3.11)
    runs-on: ubuntu-latest
    # 卡住时封顶:一次意外 hang 不会烧掉一小时 runner 时间才失败。
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # `parquet` 是必须的:`tests/test_sec_docs.py` 要写读 .parquet,缺 pyarrow 时
      # 那批测试直接 error。只装 `.[dev]` 在干净 checkout 上会红。
      # `pytest-cov` 也来自 `.[dev]`(`pytest-cov>=5.0`);pytest 会**静默忽略**
      # 未注册的 `--cov`——其实不会,它直接报 unrecognized argument 并退出,所以这
      # 条依赖不在 dev extra 里就会让整个 job 红。
      - name: 安装 dev + parquet extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,parquet]"

      # marker 过滤是测试层面的成本控制。`network` / `gpu` / `slow` 三个 marker 在
      # pyproject.toml 里已声明(其中 network 写明 "never runs in CI")。当前没有
      # 被排除的测试,所以这是护栏而非节省:防止将来某个打网络的测试把 CI 变成又贵
      # 又不稳的集成套件。
      #
      # `--cov` 与测试同一次运行,不重跑。覆盖率**不作为门槛**:加了门槛之后,为了
      # 让数字变绿而写的测试会比它发现的缺陷更多。它在这里的作用是给 README 的
      # "测试与覆盖率"一节提供可复现的来源。
      - name: pytest (package, with coverage)
        run: |
          python -m pytest -m "not network and not gpu and not slow" -q \
            --cov=shingan --cov-report=term-missing --cov-report=markdown:coverage.md

      # 把结果写进 job summary,这样不用下载日志就能在 PR 页面上读到。
      # `if: always()`:覆盖率是最需要看的时候——测试失败时——最有用。
      - name: 覆盖率写入 job summary
        if: always()
        run: |
          {
            echo "## 测试与覆盖率"
            echo ""
            echo '```'
            python -m pytest -m "not network and not gpu and not slow" -q --cov=shingan 2>&1 | tail -45
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 仓库里的 scripts/ 每个都带 argparse,`--help` 会在做任何工作前退出:纯粹
      # 验证"脚本能被导入、参数定义没坏",全程离线、约 0.5 秒/个。CLI 入口和
      # scripts 是最容易在重构里断掉、又最不容易被单元测试覆盖的两类表面。
      - name: 冒烟:脚本入口
        run: |
          for script in scripts/*.py; do
            echo "== $script"
            python "$script" --help > /dev/null
          done

      - name: 冒烟:CLI 入口
        run: shingan version
