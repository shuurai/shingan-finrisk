# 手动发布 workflow:把本地目录推到 Hugging Face Hub。
#
# 安全默认:
# - `dry_run` 默认 true,此时只打印解析后的 repo_id / path 以及将要上传的文件列表,不会推送。
# - 真实发布前必须在仓库 Settings -> Secrets and variables -> Actions 中配置 `HF_TOKEN`
#   (建议 fine-grained token,只授予目标 repo 的 write 权限)。未配置时,推送步骤会因缺少 token 失败。
# - 不硬编码任何 token、owner 或组织名,`repo_id` 完全由调用方输入。
#
# 实现说明:`hf` CLI 的入口名在不同版本间不一致(`hf` 与旧的 `huggingface-cli`),
# 因此推送统一走 `huggingface_hub` 的 Python API,避免 CLI 版本差异带来的失败。
name: publish-hf

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: 产出物类型,决定 Hugging Face 的 repo_type
        type: choice
        required: true
        default: model
        options:
          - model
          - dataset
      repo_id:
        description: 目标 repo id,形如 <owner>/<name>
        type: string
        required: true
      path:
        description: 本地待上传的目录
        type: string
        required: false
        default: artifacts/
      private:
        description: 若目标 repo 不存在,是否创建为 private
        type: boolean
        default: false
      dry_run:
        description: 只预览、不推送
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: publish (${{ inputs.artifact }})
    runs-on: ubuntu-latest
    env:
      REPO_ID: ${{ inputs.repo_id }}
      REPO_TYPE: ${{ inputs.artifact }}
      LOCAL_PATH: ${{ inputs.path }}
      PRIVATE: ${{ inputs.private }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 升级 pip
        run: python -m pip install --upgrade pip

      - name: 安装 huggingface_hub
        run: python -m pip install --upgrade huggingface_hub "huggingface_hub[cli]"

      - name: dry-run 预览
        if: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          repo_id = os.environ["REPO_ID"]
          repo_type = os.environ["REPO_TYPE"]
          path = Path(os.environ["LOCAL_PATH"])

          print("[dry-run] 不会向 Hugging Face 推送任何内容")
          print(f"[dry-run] repo_type = {repo_type}")
          print(f"[dry-run] repo_id   = {repo_id}")
          print(f"[dry-run] path      = {path.resolve()}")

          if not path.exists():
              print("[dry-run] path 不存在;真实发布前请先准备好该目录")
          elif not path.is_dir():
              print("[dry-run] path 不是目录;真实发布会失败")
          else:
              files = sorted(p for p in path.rglob("*") if p.is_file())
              print(f"[dry-run] 待上传文件数 = {len(files)}")
              for f in files[:100]:
                  print(f"[dry-run]   {f.relative_to(path)}")
              if len(files) > 100:
                  print(f"[dry-run]   ... 其余 {len(files) - 100} 个文件已省略")
          PY

      - name: 推送到 Hugging Face Hub
        if: ${{ !inputs.dry_run }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from huggingface_hub import HfApi

          repo_id = os.environ["REPO_ID"]
          repo_type = os.environ["REPO_TYPE"]
          path = Path(os.environ["LOCAL_PATH"])
          private = os.environ.get("PRIVATE", "false").lower() == "true"

          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise SystemExit("缺少 HF_TOKEN:请先在仓库 Secrets 中配置,再关闭 dry_run 重试")

          if not path.is_dir():
              raise SystemExit(f"path 不是目录:{path}")

          api = HfApi(token=token)
          api.create_repo(repo_id=repo_id, repo_type=repo_type, private=private, exist_ok=True)
          api.upload_folder(
              repo_id=repo_id,
              repo_type=repo_type,
              folder_path=str(path),
              commit_message=f"Upload {path.name} artifacts",
          )
          print(f"已发布 {repo_type} 到 Hugging Face Hub:{repo_id}")
          PY
