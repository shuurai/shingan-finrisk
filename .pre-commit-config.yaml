# Pre-commit hooks. Install once with:  pre-commit install
# Run against everything with:         pre-commit run --all-files
# On Windows use the same commands inside PowerShell; pre-commit is pure Python.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        # Data payloads and checkpoints belong in DVC/HF, never in git history.
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks
        # Symlinks are avoided on purpose: they break on Windows without
        # Developer Mode and HF caches create them by default on Linux.
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]
        files: ^tests/.*\.py$
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: \.ipynb$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Mirrors the mypy configuration in pyproject.toml. `ignore_missing_imports`
        # is set there, so third-party stubs are not required.
        additional_dependencies: ["types-PyYAML"]
        files: ^src/
        args: ["--config-file=pyproject.toml"]
